{% extends 'usuarios/base.html' %}
{% block conteudo %}

<form action="{% url 'editar_usuario' usuario.id_usuario %}" method="post">
    {% csrf_token %}

    <div class="container text-center">
        <h1>Editar Usuário</h1>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input id="nome" name="nome" class="form-control form-control-sm" type="text" value="{{ usuario.nome }}" required>
        </div>

        <div class="mb-3">
            <label for="idade" class="form-label">Idade</label>
            <input id="idade" name="idade" class="form-control form-control-sm" type="number" value="{{ usuario.idade }}" required>
        </div>

        <button type="submit" class="btn btn-success btn-sm">Salvar</button>
        <a href="{% url 'listagem_usuarios' %}" class="btn btn-secondary btn-sm">Cancelar</a>
    </div>
</form>

{% endblock %}
